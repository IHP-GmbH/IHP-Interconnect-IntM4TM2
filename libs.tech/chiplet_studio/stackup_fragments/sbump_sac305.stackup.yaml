# IHP PacTech SAC305 solder-bump 3D stackup fragment (Section 6.9.1, 80um ball).
# Heights mirror the manifest's connection_stack for sbump_sac305.
#
# Method-keyed: chiplet-studio selects this fragment from a die's
# `connection:` id, so each die renders/seats with its own method's bodies.
#
# z values are relative to the interposer's attachment surface (declared by
# z_reference: attachment_surface); the consumer offsets them by the
# attachment_surface_z the interposer stackup declares.

z_reference: attachment_surface

